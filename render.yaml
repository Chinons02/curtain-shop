services:
  - type: web
    name: curtain-shop
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn curtain_shop.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: curtain-shop-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false   # Set this manually in the Render dashboard

databases:
  - name: curtain-shop-db
    databaseName: curtain_shop
    user: curtain_shop_user
    plan: free
